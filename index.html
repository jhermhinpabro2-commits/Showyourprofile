<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JHER PROFILE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            min-height: 100vh;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        /* 🎥 BACKGROUND VIDEO */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
        }

        /* ❄️ SNOWFLAKE EFFECT */
        .snowflake {
            position: fixed;
            top: -50px;
            color: #fff;
            font-size: 1em;
            pointer-events: none;
            z-index: -1;
            animation: fall linear forwards;
            opacity: 0.7;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }

        /* 🔊 AUDIO BUTTON */
        #audioToggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 12px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 18px;
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: all 0.3s;
        }
        #audioToggle:hover { background: rgba(255,255,255,0.25); }

        /* 📱 MAIN CARD */
        .card {
            max-width: 420px;
            margin: 60px auto;
            padding: 30px;
            background: rgba(0,0,0,0.6);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            text-align: center;
        }

        /* 👤 AVATAR */
        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 0 25px rgba(255,255,255,0.35);
            margin-bottom: 20px;
        }

        /* ✨ USERNAME */
        .username {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 15px currentColor;
        }

        /* 📝 DESCRIPTION */
        .description {
            font-size: 16px;
            opacity: 0.85;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* 🔗 SOCIAL LINKS */
        .socials {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .social-btn {
            padding: 12px 24px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            transition: all 0.3s;
            font-size: 15px;
        }
        .social-btn:hover {
            background: rgba(255,255,255,0.22);
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(255,255,255,0.2);
        }

        /* 🎨 COLOR CUSTOMIZATION — EDIT MO ITO! */
        :root {
            --primary: #000000;
            --accent: #ffffff;
            --text: #ffffff;
            --bg: #f8f9fa;
            --icon: #ffffff;
            --effect: #000000;
        }
        .username { color: var(--accent); }
        .card { border-color: var(--accent); }
    </style>
</head>
<body>

<!-- 🎥 BACKGROUND VIDEO — PALITAN MO ANG LINK SA IBABA -->
<video id="bgVideo" autoplay muted loop playsinline>
    <source src="https://your-video-link-here.mp4" type="video/mp4">
</video>

<!-- 🔊 BACKGROUND MUSIC — PALITAN MO ANG LINK SA IBABA -->
<audio id="bgAudio" loop>
    <source src="https://your-audio-link-here.mp3" type="audio/mpeg">

<button id="audioToggle">🔊 Music ON</button>

<!-- ❄️ SNOWFLAKE CONTAINER -->
<div id="snowContainer"></div>

<!-- 📱 PROFILE CARD -->
<div class="card">
    <img class="avatar" id="avatarImg" src="https://your-avatar-link.webp" alt="Avatar">
    <h1 class="username" id="usernameTxt">JHER</h1>
    <p class="description" id="descTxt">Welcome to my world ✨</p>

    <div class="socials">
        <a class="social-btn" href="#" target="_blank">🎵 TikTok</a>
        <a class="social-btn" href="#" target="_blank">📷 Instagram</a>
        <a class="social-btn" href="#" target="_blank">💬 Discord</a>
        <a class="social-btn" href="#" target="_blank">🎮 Roblox</a>
    </div>
</div>

<script>
// 🔊 MUSIC TOGGLE
const audio = document.getElementById('bgAudio');
const audioBtn = document.getElementById('audioToggle');
let isPlaying = false;

audioBtn.addEventListener('click', () => {
    if (!isPlaying) {
        audio.play().catch(e => console.log('Click to play audio'));
        audioBtn.textContent = '🔇 Music OFF';
        isPlaying = true;
    } else {
        audio.pause();
        audioBtn.textContent = '🔊 Music ON';
        isPlaying = false;
    }
});

// ❄️ SNOWFLAKE GENERATOR
function createSnowflakes() {
    const container = document.getElementById('snowContainer');
    const count = 50; // dami ng snowflakes
    for (let i = 0; i < count; i++) {
        const snow = document.createElement('div');
        snow.classList.add('snowflake');
        snow.innerHTML = '❄';
        snow.style.left = Math.random() * 100 + 'vw';
        snow.style.animationDuration = (Math.random() * 5 + 5) + 's';
        snow.style.fontSize = (Math.random() * 10 + 8) + 'px';
        snow.style.opacity = Math.random() * 0.6 + 0.3;
        container.appendChild(snow);
    }
}
createSnowflakes();
</script>

</body>
</html>
