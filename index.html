<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JHER — Profile Creator 🎨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
        }

        :root {
            --accent-green: #39ff14;
            --accent-purple: #9d4edd;
            --accent-pink: #ff2e88;
            --bg-dark: #000000;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-white: #ffffff;
            --text-gray: #cccccc;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-white);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== TABS ===== */
        .tabs {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
        }

        .tab {
            flex: 1;
            padding: 1rem;
            border: none;
            background: transparent;
            color: #888;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: var(--accent-green);
            border-bottom: 2px solid var(--accent-green);
        }

        .tab-content {
            display: none;
            padding-top: 70px;
        }

        .tab-content.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== CREATOR TAB — FORM ===== */
        .creator-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .creator-title {
            font-size: 1.8rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #aaa;
            font-size: 0.9rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 0.9rem 1rem;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--accent-green);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .create-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-purple));
            border: none;
            border-radius: 12px;
            color: black;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: transform 0.2s ease;
        }

        .create-btn:hover {
            transform: scale(1.02);
        }

        .share-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background: var(--glass);
            border-radius: 10px;
            display: none;
        }

        .share-box.show {
            display: block;
        }

        .link-output {
            background: rgba(0,0,0,0.4);
            padding: 0.8rem;
            border-radius: 8px;
            word-break: break-all;
            color: var(--accent-green);
            font-size: 0.9rem;
            margin: 0.5rem 0;
        }

        .copy-btn {
            padding: 0.5rem 1rem;
            background: var(--accent-purple);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        /* ===== PREVIEW TAB — EXACTLY GUNS.LOL STYLE ===== */
        .preview-container {
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.7);
            z-index: 1;
        }

        .bg-upload {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7);
            z-index: 1;
            display: none;
        }

        .content-layer {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4rem 2rem 6rem;
            min-height: 100vh;
        }

        /* Sparkle particles */
        .sparkle {
            position: absolute;
            color: white;
            font-size: 14px;
            text-shadow: 0 0 6px white;
            animation: float 6s infinite ease-in-out;
            z-index: 3;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
        }

        /* Avatar with green glow ring */
        .avatar-wrap {
            position: relative;
            margin-bottom: 1.2rem;
        }

        .avatar-ring {
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            border: 2px solid var(--accent-green);
            box-shadow: 0 0 15px var(--accent-green), inset 0 0 10px var(--accent-green);
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0%, 100% { box-shadow: 0 0 15px var(--accent-green), inset 0 0 10px var(--accent-green); }
            50% { box-shadow: 0 0 25px var(--accent-green), inset 0 0 15px var(--accent-green); }
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #222;
            object-fit: cover;
            border: 3px solid black;
        }

        .avatar-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #333, #555);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border: 3px solid black;
        }

        /* Username — glitchy font style */
        .username {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: white;
            text-shadow: 0 0 10px white, 0 0 20px rgba(255,255,255,0.5);
            margin-bottom: 0.8rem;
            font-family: 'Courier New', monospace;
        }

        /* Status card — glassmorphism */
        .status-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            width: 100%;
            max-width: 340px;
        }

        .status-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            background: #333;
        }

        .status-info {
            flex: 1;
        }

        .status-top {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.3rem;
        }

        .date-tag {
            background: rgba(255,255,255,0.15);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .badge {
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .status-text {
            color: #ddd;
            font-size: 0.95rem;
        }

        /* Social icons */
        .social-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .social-icon {
            font-size: 2.2rem;
            color: white;
            text-decoration: none;
            transition: transform 0.2s ease, text-shadow 0.2s ease;
        }

        .social-icon:hover {
            transform: scale(1.15);
            text-shadow: 0 0 10px white;
        }

        /* Music player — glass style */
        .music-player {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
            max-width: 340px;
        }

        .music-icon {
            font-size: 1.8rem;
        }

        .music-info {
            flex: 1;
        }

        .music-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .music-bar {
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .music-progress {
            height: 100%;
            background: white;
            width: 5%;
            border-radius: 2px;
        }

        .music-time {
            font-size: 0.75rem;
            color: #aaa;
            margin-top: 0.2rem;
        }

        .music-controls {
            font-size: 1.3rem;
            display: flex;
            gap: 0.5rem;
        }

        /* Motto / Text at bottom */
        .motto {
            margin-top: 2rem;
            text-align: center;
            color: #fff;
            font-size: 1rem;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
            max-width: 320px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- ===== TABS ===== -->
    <div class="tabs">
        <button class="tab active" onclick="switchTab('creator')">🎨 Create</button>
        <button class="tab" onclick="switchTab('preview')">👁️ Preview</button>
    </div>

    <!-- ===== CREATOR TAB ===== -->
    <div id="creatorTab" class="tab-content show">
        <div class="creator-container">
            <h2 class="creator-title">🎨 CREATE YOUR PROFILE</h2>

            <div class="input-group">
                <label>🖼️ Background Image URL</label>
                <input type="url" id="bgInput" placeholder="Paste image link here...">
            </div>

            <div class="input-group">
                <label>👤 Avatar / Profile Picture URL</label>
                <input type="url" id="avatarInput" placeholder="Paste image link here...">
            </div>

            <div class="input-group">
                <label>✦ Username / Display Name</label>
                <input type="text" id="usernameInput" placeholder="zxns.zxxn">
            </div>

            <div class="input-group">
                <label>📅 Date / Tag (e.g. 07.09.27)</label>
                <input type="text" id="dateInput" placeholder="07.09.27">
            </div>

            <div class="input-group">
                <label>🏅 Badge (e.g. VALK)</label>
                <input type="text" id="badgeInput" placeholder="VALK">
            </div>

            <div class="input-group">
                <label>💬 Status / Bio</label>
                <textarea id="statusInput" placeholder="currently doing nothing"></textarea>
            </div>

            <div class="input-group">
                <label>🎵 Music / Song Name</label>
                <input type="text" id="musicInput" placeholder="my day">
            </div>

            <div class="input-group">
                <label>🎵 Music Duration</label>
                <input type="text" id="musicDurInput" placeholder="0:02 — 3:44">
            </div>

            <div class="input-group">
                <label>💬 Motto / Bottom Text</label>
                <textarea id="mottoInput" placeholder="Your text here..."></textarea>

            <div class="input-group">
                <label>🔗 Discord Link</label>
                <input type="url" id="discordInput" placeholder="https://discord.com/...">
            </div>

            <div class="input-group">
                <label>🎵 TikTok Link</label>
                <input type="url" id="tiktokInput" placeholder="https://tiktok.com/@...">
            </div>

            <button class="create-btn" onclick="generateProfile()">✨ GENERATE PROFILE</button>

            <div class="share-box" id="shareBox">
                <h4>✅ Your Profile Link:</h4>
                <div class="link-output" id="linkOutput"></div>
                <button class="copy-btn" onclick="copyLink()">📋 Copy Link</button>
            </div>
        </div>
    </div>

    <!-- ===== PREVIEW TAB — EXACTLY GUNS.LOL STYLE ===== -->
    <div id="previewTab" class="tab-content">
        <div class="preview-container" id="previewContainer">
            
            <!-- Background -->
            <div class="bg-layer" id="bgLayer" style="background: linear-gradient(135deg, #1a1a2e, #2d1b47);"></div>
            <img class="bg-upload" id="bgUpload" src="" alt="Background">

            <!-- Sparkles -->
            <div id="sparkles"></div>

            <div class="content-layer">
                
                <!-- Avatar -->
                <div class="avatar-wrap">
                    <div class="avatar-ring"></div>
                    <img class="avatar" id="previewAvatar" src="" alt="" style="display: none;">
                    <div class="avatar-placeholder" id="avatarPlaceholder">🔫</div>
                </div>

                <!-- Username -->
                <div class="username" id="previewUsername">ZXNS.ZXXN</div>

                <!-- Status Card -->
                <div class="status-card">
                    <img class="status-avatar" id="statusAvatar" src="" alt="" style="display: none;">
                    <div class="status-info">
                        <div class="status-top">
                            <span class="date-tag" id="previewDate">07.09.27</span>
                            <span class="badge" id="previewBadge">VALK</span>
                        </div>
                        <div class="status-text" id="previewStatus">currently doing nothing</div>
                    </div>
                </div>

                <!-- Social Links -->
                <div class="social-links">
                    <a href="#" id="discordLink" class="social-icon" target="_blank">💬</a>
                    <a href="#" id="tiktokLink" class="social-icon" target="_blank">🎵</a>
                </div>

                <!-- Music Player -->
                <div class="music-player">
                    <div class="music-icon">🎵</div>
                    <div class="music-info">
                        <div class="music-title" id="previewMusic">my day</div>
                        <div class="music-bar">
                            <div class="music-progress"></div>
                        </div>
                        <div class="music-time" id="previewMusicDur">0:02 — 3:44</div>
                    </div>
                    <div class="music-controls">
                        <span>⏮️</span>
                        <span>▶️</span>
                        <span>⏭️</span>
                    </div>
                </div>

                <!-- Motto / Bottom Text -->
                <div class="motto" id="previewMotto"></div>

            </div>
        </div>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        // Switch tabs
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('show'));
            event.target.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('show');
            
            if (tabName === 'preview') {
                generateProfile();
                generateSparkles();
            }
        }

        // Generate sparkles/snowflakes
        function generateSparkles() {
            const sparkleContainer = document.getElementById('sparkles');
            sparkleContainer.innerHTML = '';
            const chars = ['❄', '✻', '✦', '✧', '⋆', '✵'];
            for (let i = 0; i < 15; i++) {
                const s = document.createElement('span');
                s.className = 'sparkle';
                s.textContent = chars[Math.floor(Math.random() * chars.length)];
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.animationDelay = (Math.random() * 6) + 's';
                sparkleContainer.appendChild(s);
            }
        }
